<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  A private session bus for the snapshots and tests (dbus-run-session -config-file=…): like the standard
  session bus, but WITHOUT service activation. Otherwise the module's first calls (portals, secrets,
  accessibility, …) would start real desktop services on the private bus, which outlive the test.
  Only the mock plasmaard (and what the test starts itself) lives on this bus.
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
