name: kcm

# The System Settings module (kcm/): build it warning-free, run its tests (the staging model, the
# controller against tools/mock_plasmaard.py on a private bus, qmllint) and check the translations.

on:
  push:
    paths:
      - "kcm/**"
      - "tools/mock_plasmaard*"
      - ".github/workflows/kcm.yml"
  pull_request:
    paths:
      - "kcm/**"
      - "tools/mock_plasmaard*"
      - ".github/workflows/kcm.yml"

jobs:
  build:
    name: build and test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:26.04", "fedora:latest"]

    steps:
      - name: Install dependencies (Ubuntu)
        if: startsWith(matrix.image, 'ubuntu')
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake ninja-build g++ extra-cmake-modules gettext \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev \
            libkf6kcmutils-dev libkf6i18n-dev libkf6coreaddons-dev libkirigami-dev \
            qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            dbus-daemon python3 python3-gi gir1.2-glib-2.0

      - name: Install dependencies (Fedora)
        if: startsWith(matrix.image, 'fedora')
        run: |
          dnf install -y \
            cmake ninja-build gcc-c++ extra-cmake-modules gettext \
            qt6-qtbase-devel qt6-qtdeclarative-devel qt6-qttools-devel \
            kf6-kcmutils-devel kf6-ki18n-devel kf6-kcoreaddons-devel kf6-kirigami-devel \
            dbus-daemon dbus-tools python3 python3-gobject-base

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S kcm -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Check translations
        run: |
          for po in kcm/po/*/*.po; do msgfmt --check --statistics -o /dev/null "$po"; done
